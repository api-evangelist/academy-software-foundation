x-note: "This overlay records what API Evangelist knows about the OpenCue REST Gateway that the underlying\
  \ document does not say. The underlying document was AUTHORED BY API EVANGELIST from documentation (see\
  \ openapi/_ae-authored/README.md) and its paths are resource-shaped (/api/host, /api/show/{show_id}/job);\
  \ the real gateway uses grpc-gateway UNBOUND METHOD ROUTING, where every path is POST /<package>.<Service>/<Method>.\
  \ The overlay does NOT rewrite those paths \u2014 an overlay never mutates the original, and rewriting\
  \ them would produce a second authored contract rather than a harvested one. It annotates the document\
  \ with the provider-published facts so a reader is not misled: the real default port, the JWT scheme,\
  \ the error envelope, the rate-limit headers, and where the authoritative contract actually lives (grpc/,\
  \ 18 .proto files, 304 RPCs)."
actions:
- target: $.info
  description: Record the authoritative contract and the authorship of this document.
  update:
    x-authoritative-contract: "grpc/ \u2014 18 OpenCue .proto files, 28 services, 304 RPCs"
    x-contract-source: https://github.com/AcademySoftwareFoundation/OpenCue/tree/master/proto/src
    x-authored-by: "API Evangelist, from documentation \u2014 not published by ASWF"
