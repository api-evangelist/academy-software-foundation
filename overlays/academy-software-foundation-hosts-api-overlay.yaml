    and that it is configurable, because OpenCue is deployed by the studio, not by ASWF.
  update:
    x-documented-base: http://your-gateway:8448
    x-documented-base-source: https://github.com/AcademySoftwareFoundation/OpenCue/blob/master/docs/_docs/reference/rest-api-reference.md
    x-self-hosted: true
- target: $.components
  description: Add the JWT bearer scheme the gateway actually enforces on every route.
  update:
    securitySchemes:
      bearerAuth:
        type: http
        scheme: bearer
        bearerFormat: JWT
        description: 'HS256 JWT with required claims sub and exp. Sent as Authorization: Bearer <token>.
          Issued by the studio operating the gateway, not by ASWF. 401 when the header is missing or malformed,
          403 when validation fails or the token has expired. The only unauthenticated routes are /swagger/
          and its three asset files.'
