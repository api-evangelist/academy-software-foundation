specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Academy Software Foundation
providerId: academy-software-foundation
generated: '2026-08-29'
method: searched
source: https://github.com/AcademySoftwareFoundation/OpenCue/blob/master/docs/_docs/reference/rest-api-reference.md
created: '2026-05-04'
modified: '2026-08-29'
reconciled: true
description: >-
  ASWF operates no metered public API, so there are no foundation-published quotas. The OpenCue REST
  Gateway — the one HTTP surface any ASWF project ships — does publish a rate limit, and it publishes
  the response headers with it. The limit is enforced by the studio's own gateway deployment and is
  configurable, so the number below is the shipped default rather than a ceiling ASWF imposes.
limit_count: 1
limits:
  - api: academy-software-foundation:academy-software-foundation-jobs-api
    name: OpenCue REST Gateway default request rate
    scope: per-client
    limit: 100
    unit: requests
    window: 1s
    burst: null
    configurable: true
    configuration: RATE_LIMIT_RPS environment variable on the gateway
    source: https://github.com/AcademySoftwareFoundation/OpenCue/blob/master/docs/_docs/reference/rest-api-reference.md
responseHeaders:
  - name: X-RateLimit-Limit
    description: The ceiling for the current window (e.g. 100).
  - name: X-RateLimit-Remaining
    description: Requests left in the current window (e.g. 95).
  - name: X-RateLimit-Reset
    description: Unix timestamp at which the window resets (e.g. 1694001000).
retry_after: false
exhaustion_status: null
exhaustion_note: >-
  The published reference documents the limit and the three response headers but does not state the
  status code returned on exhaustion, and no ASWF-operated host exists to observe one. Recorded as
  unknown rather than guessed.
responseCodes:
  '401': Missing or invalid Authorization header
  '403': Token validation failed or expired
  '404': Not Found — resource missing, or an interface the gateway does not route
  '500': Internal server error
policies:
  - name: License boundary
    description: >-
      ASWF libraries (OpenEXR, OpenVDB, OpenColorIO, OpenTimelineIO, OSL, MaterialX, OpenImageIO)
      are consumed in-process under Apache 2.0 / BSD-3-Clause. There are no per-call quotas because
      there are no calls over a network.
sources:
  - https://github.com/AcademySoftwareFoundation/OpenCue/blob/master/docs/_docs/reference/rest-api-reference.md
  - https://www.aswf.io/projects/
maintainers:
  - FN: Kin Lane
    email: info@apievangelist.com
