source: >-
  PyPI JSON metadata endpoints (pypi.org/pypi/<pkg>/json) queried 2026-08-29, cross-checked against
  github.com/AcademySoftwareFoundation repositories for first-party ownership
note: >-
  ASWF ships libraries, not a hosted API, so its "SDK" surface is the set of language bindings and
  client packages each project publishes. Every entry below is published from an ASWF-hosted
  repository. npm, crates.io and RubyGems were probed and hold NO first-party ASWF package: the npm
  `opentimelineio` package is a third-party TypeScript port (github.com/fifteen42/otio.js), npm
  `materialx` is an unrelated project, npm `openexr` is a security-holding placeholder, and the
  crates.io `openexr` crate is third-party Rust bindings. `Imath` on PyPI is likewise a different
  project (innovata) and is NOT the ASWF Imath library. Those are recorded here as explicit
  negatives so a later round does not re-adopt them as first-party.
