description: >-
  ASWF sells no API access and meters nothing. Every hosted project — OpenEXR, OpenVDB,
  OpenColorIO, OpenTimelineIO, Open Shading Language, MaterialX, OpenCue, OpenImageIO, OpenFX,
  OpenAPV, OpenPBR, rez, OpenRV — is free open source under Apache 2.0, BSD-3-Clause or MIT, and
  OpenCue's gRPC and REST surfaces run on hardware the consuming studio owns. There is therefore no
  API plan to record. What ASWF DOES publish, with real numbers, is corporate membership pricing;
  that is captured separately below so it is not mistaken for API pricing.
plan_count: 0
plans: []
pricing_model: none
metering: none
free_tier: n/a
membership_tiers:
  note: >-
    Foundation membership fees, NOT API plans. Membership buys governance participation and
    marketing presence; it buys no additional API capability, rate limit or support tier, and
    non-members have identical access to every project. Recorded verbatim from the published page
    for accuracy, and deliberately kept out of plans[] so it cannot be scored as API pricing.
  source: https://www.aswf.io/join/
  currency: USD
  billing_period: annual
  requirement: >-
    Corporate membership in ASWF requires corporate membership in The Linux Foundation (Silver
    tier pricing is listed separately on the same page).
  tiers:
    - name: Premier Member
      price: 50000
    - name: General — 5,000 and above employees
      price: 20000
    - name: General — 2,000-4,999 employees
      price: 15000
    - name: General — 500-1,999 employees
      price: 10000
    - name: General — less than 499 employees
      price: 5000
    - name: Associate (pre-approved non-profits, open source projects and government entities)
      price: 0
  linux_foundation_silver:
    - name: 5,000 and above employees
      price: 20000
    - name: 500-4,999 employees
      price: 15000
    - name: 100-499 employees
      price: 10000
    - name: Less than 99 employees
      price: 5000
    - name: Associate
      price: 0
