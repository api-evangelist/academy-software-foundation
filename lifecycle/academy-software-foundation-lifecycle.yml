project_lifecycle:
  published: true
  source: https://github.com/AcademySoftwareFoundation/tac/blob/main/process/lifecycle.md
  governance: >-
    Adopted or amended by majority vote of both the Technical Advisory Council (TAC) and the
    Governing Board.
  stages:
    - name: Sandbox
      description: >-
        Entry point for early-stage projects. Requires an approved Technical Charter, trademark
        transfer to LF Projects LLC, a clean license scan, a completed contribution proposal, a
        presentation to the TAC and an affirmative TAC vote.
      expectation: >-
        Expected to reach Incubation within one year; the TAC may vote a project out of Sandbox if
        it does not report progress.
    - name: Incubation
      description: Projects that have met the TAC's requirements to move beyond Sandbox.
    - name: Graduated
      description: Production-grade projects with established governance and contributor base.
    - name: Archived
      description: >-
        The published end-of-life state for an ASWF project. This is the foundation's deprecation
        path — a project is archived by the TAC rather than an individual endpoint being sunset.
  review_cycle: https://github.com/AcademySoftwareFoundation/tac/blob/main/process/review_cycle.md
deprecation:
  policy_published: true
  policy_url: https://github.com/AcademySoftwareFoundation/tac/blob/main/process/lifecycle.md
  scope: project-level
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    ASWF publishes a project retirement path (the Archived stage above) and per-project release
    notes carry deprecation announcements, but no RFC 8594 Sunset/Deprecation header is emitted by
    any ASWF surface — there is no ASWF-operated origin to emit one.
  routed_surface_gap:
    description: >-
      The closest thing OpenCue has to a per-operation deprecation signal is the gap between the
      published and the routed surface: 31 of the 304 endpoints its OpenAPI definitions describe are
      not registered on the gateway and return 404 / gRPC NOT_FOUND. The provider documents this
      explicitly rather than removing the definitions.
    source: https://github.com/AcademySoftwareFoundation/OpenCue/blob/master/docs/_docs/reference/rest-api-reference.md
