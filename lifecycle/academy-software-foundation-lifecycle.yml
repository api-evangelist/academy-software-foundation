  wire_versioning: none
  note: >-
    ASWF versions projects, not endpoints. Each hosted project releases independently under semantic
    versioning and tags releases on GitHub. Neither the OpenCue gRPC contract nor its REST Gateway
    carries a version segment or version header, so a client's "API version" is whichever OpenCue
    release the studio deployed.
