  - date: '2026-08-26'
    project: OpenCue
    title: Swagger UI for the REST Gateway
    url: https://github.com/AcademySoftwareFoundation/OpenCue/blob/master/docs/news/2026-08-26-rest-gateway-swagger-ui.md
    summary: >-
      The gateway now serves an interactive Swagger UI at /swagger/ and 18 downloadable OpenAPI 2.0
      definitions at /swagger/specs/<proto>.swagger.json, generated at build time by
      protoc-gen-openapiv2 over the same .proto files saved in grpc/. 304 endpoints described,
      273 routed. This is the single most agent-relevant change ASWF has shipped: before it, a
      running gateway described nothing about itself.
